<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #0a0910; color: #fff; font-family: sans-serif; padding: 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px; width: 180px; text-align: center; }
    .card img { width: 100%; height: 180px; object-fit: contain; }
    .title { margin-top: 8px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Samples: Open Cases with Telegram Gifts</h2>
  <div class="grid">

    <div class="card">
      <img src="cap_sample.png" />
      <div class="title">CAP</div>
    </div>
    
    <div class="card">
      <img src="pepe_sample.png" />
      <div class="title">PEPE</div>
    </div>
    
    <div class="card">
      <img src="vip_sample.png" />
      <div class="title">VIP</div>
    </div>
    
    <div class="card">
      <img src="magic_sample.png" />
      <div class="title">MAGIC</div>
    </div>
    
    <div class="card">
      <img src="space_sample.png" />
      <div class="title">SPACE</div>
    </div>
    
    <div class="card">
      <img src="ring_sample.png" />
      <div class="title">RING</div>
    </div>
    
    <div class="card">
      <img src="adult18_sample.png" />
      <div class="title">ADULT18</div>
    </div>
    
    <div class="card">
      <img src="free_sample.png" />
      <div class="title">FREE</div>
    </div>
    
  </div>
</body>
</html>
